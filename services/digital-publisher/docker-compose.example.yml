services:
  digital-publisher:
    build: .
    env_file: .env
    environment:
      DIGITAL_BROWSER_STORAGE_DIR: /app/.browser-profiles
      DIGITAL_BROWSER_HEADLESS: "true"
    ports:
      - "8791:8791"
    volumes:
      - browser_profiles:/app/.browser-profiles
    restart: unless-stopped

volumes:
  browser_profiles:
